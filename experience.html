.logo{display:block;aspect-ratio:560/574;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(3.4rem + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100svh;background:var(--night) linear-gradient(var(--sky-a),var(--sky-b)) fixed;color:var(--ash);
  font:400 1.125rem/1.65 var(--text);transition:--sky-a 2.5s ease,--sky-b 2.5s ease;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
a{color:var(--flame);text-underline-offset:.18em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--flame);outline-offset:3px;border-radius:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:.98;margin:0;letter-spacing:.005em}
p{margin:0 0 1em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.skip{position:fixed;left:1rem;top:-4rem;z-index:30;background:var(--flame);color:#000;padding:.5rem 1rem}
.skip:focus{top:calc(.5rem + env(safe-area-inset-top,0px))}

/* ---------- fixed layers ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;left:0;right:0;bottom:0;height:55vh;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(246,150,50,.42),rgba(232,102,42,.14) 38%,transparent 70%);opacity:var(--lit)}
.flash{position:fixed;inset:0;z-index:20;pointer-events:none;background:#dfe8ff;opacity:0}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.85}12%{opacity:.15}20%{opacity:.6}100%{opacity:0}}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,2px)}}

/* ---------- top bar ---------- */
.bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:.4rem;
  padding:.25rem max(.9rem,3vw);background:rgba(8,11,18,.78);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.07);font-size:.9rem}
.brand{font-family:var(--display);color:var(--rice);text-decoration:none;margin-right:auto;font-size:1rem;white-space:nowrap}
.brand .logo{height:2.5rem}
.bar button,.bar a.tab{background:none;border:1px solid transparent;border-radius:999px;padding:.3rem .7rem;color:var(--ash);text-decoration:none;white-space:nowrap}
.bar button:hover,.bar a.tab:hover{border-color:var(--line);color:var(--rice)}
.bar .lang{border-color:var(--line);min-width:2.6rem}
body[data-view="night"] .tab-night,body[data-view="press"] .tab-press,body[data-view="press"] .tl-wrap{display:none}
.tl-wrap{position:relative}
.tl{position:absolute;right:0;top:calc(100% + .6rem);width:min(22rem,88vw);margin:0;padding:.5rem;list-style:none;background:#0d121d;border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.tl[hidden]{display:none}
.tl a{display:grid;grid-template-columns:1.6rem 1fr auto;gap:.5rem;align-items:baseline;padding:.45rem .6rem;border-radius:6px;color:var(--ash);text-decoration:none}
.tl a:hover,.tl a[aria-current]{background:var(--smoke);color:var(--rice)}
.tl .n{color:var(--ash-dim);font-variant-numeric:tabular-nums}
.tl .ok{width:.6rem;height:.6rem;border-radius:50%;border:1px solid var(--ash-dim)}
.tl .ok.on{background:var(--flame);border-color:var(--flame);box-shadow:0 0 8px var(--ember)}
@media (max-width:720px){.tl{position:fixed;left:3vw;right:3vw;width:auto;top:calc(3.2rem + env(safe-area-inset-top,0px))}.bar{font-size:.82rem;gap:.15rem}.bar button,.bar a.tab{padding:.3rem .5rem}}

/* ---------- the night ---------- */
main{position:relative;z-index:1}
#night{padding-top:3rem}
body[data-view="press"] #night,body[data-view="night"] #press{display:none}

.hero{min-height:calc(100svh - 3rem);display:grid;align-content:center;justify-items:center;text-align:center;padding:3rem 1.25rem 9rem;gap:1.1rem}
.hero .by{color:#5a6585;margin:0;transition:color 1.6s}
.hero .by .logo{width:clamp(7.5rem,17vw,11rem)}
.hero h1{font-size:clamp(3.4rem,15vw,11rem);line-height:.86;
  background:linear-gradient(to top,var(--ember) 2%,var(--flame) 30%,var(--rice) 78%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;-webkit-text-fill-color:color-mix(in srgb,#5a6585 calc((1 - var(--lit1,0))*100%),transparent)}
.hero h1 span{display:block}
.hero .sub{max-width:30rem;margin:0;color:var(--ash-dim);transition:color 1.6s}
.hero.lit .sub{color:var(--ash)}.hero.lit .by{color:var(--rice)}
.strike{position:relative;width:6rem;height:6rem;border-radius:50%;border:1px solid var(--line);background:rgba(10,14,23,.6);display:grid;place-items:center;margin-top:.6rem;touch-action:none;user-select:none;-webkit-user-select:none}
.strike svg{width:2.2rem;height:2.2rem}
.strike .ring{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg)}
.strike .ring circle{fill:none;stroke:var(--flame);stroke-width:3;stroke-dasharray:302;stroke-dashoffset:calc(302 - 302*var(--hold,0))}
.hero .hint{font-style:italic;color:var(--ash-dim);margin:0;min-height:1.7em}
.hero.lit .strike,.hero.lit .hint{display:none}
.intro{max-width:34rem;text-align:left;display:none}
.hero.lit .intro{display:block;animation:rise 1.4s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.go-on{display:inline-block;margin-top:.4rem}

.song{min-height:100svh;display:grid;align-content:center;gap:1.4rem 4.5rem;padding:5rem max(1.25rem,5vw) 9rem;position:relative;
  grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "scene" "story"}
.s-head{grid-area:head}.s-scene{grid-area:scene}.s-story{grid-area:story;max-width:34rem}
@media (min-width:900px){
  .song{grid-template-columns:minmax(0,33rem) minmax(0,1fr);grid-template-areas:"head scene" "story scene";align-content:center;align-items:start;max-width:80rem;margin-inline:auto}
  .s-scene{position:sticky;top:6rem}
}
.when{display:flex;gap:1.2rem;font-style:italic;color:var(--ash-dim);margin:0 0 .5rem;font-size:1rem}
.when span + span{color:var(--flame)}
.song h2{font-size:clamp(2.5rem,7.2vw,5.2rem);color:var(--rice);text-wrap:balance}
.feat{margin:.5rem 0 0;font-style:italic;color:var(--ash-dim)}
.line{font-size:1.35rem;line-height:1.35;font-style:italic;font-weight:300;color:var(--rice);margin:1.1rem 0 0;max-width:28rem}
.reading{border-left:2px solid var(--ember);padding-left:1rem;color:var(--ash)}
.meta{font-size:.95rem;color:var(--ash-dim);margin:1.4rem 0 0;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1)}
.meta p{margin:0 0 .35em}
.meta a{margin-right:1rem;display:inline-block}
.pill{background:none;border:1px solid var(--line);border-radius:999px;padding:.45rem 1.1rem;color:var(--rice)}
.pill:hover{border-color:var(--flame)}
.pill.hot{background:var(--ember);border-color:var(--ember);color:#150a04;font-weight:600}
.pill.hot:hover{background:var(--flame)}
.scene{position:relative;display:grid;place-items:center;gap:1rem;min-height:300px}
.status{min-height:3.3em;margin:.9rem 0 0;text-align:center;font-style:italic;color:var(--flame);position:relative;z-index:4}
.fine{font-size:.85rem;color:var(--ash-dim);text-align:center;margin:.2rem 0 0}

/* Boots On */
.poster{position:relative;width:100%;height:clamp(180px,34vw,300px);display:grid;place-items:center;overflow:hidden;--g:0}
.poster span{position:absolute;white-space:nowrap}
.poster .shine{font:italic 300 clamp(2.6rem,9vw,6rem)/1 var(--text);letter-spacing:.14em;opacity:calc(1 - var(--g));filter:blur(calc(var(--g)*8px));
  background:linear-gradient(#fff,#8ea4cc 52%,#fdfdff 60%,#b8c6e2);-webkit-background-clip:text;background-clip:text;color:transparent}
.poster .grit{font:400 clamp(3.2rem,12vw,8rem)/1 var(--display);color:var(--ember);opacity:var(--g);filter:url(#rough);
  transform:rotate(calc(var(--g)*-4deg)) scale(calc(.82 + var(--g)*.18));text-shadow:0 0 calc(var(--g)*40px) rgba(232,102,42,.5)}
.dial{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;width:min(100%,30rem);font-size:.95rem;color:var(--ash-dim)}
.dial input{width:100%;accent-color:var(--ember);height:2rem}

/* Rooster */
.roost{width:min(100%,460px);overflow:visible;touch-action:manipulation}
.roost .ghost *{fill:none;stroke:rgba(255,255,255,.16);stroke-width:1.2;stroke-dasharray:4 5}
.roost .pc{cursor:pointer;transform-box:fill-box;transform-origin:center;transform:translate(var(--dx),var(--dy)) rotate(var(--r));transition:transform .8s cubic-bezier(.2,.9,.25,1.05)}
.roost .pc.set{transform:none;cursor:default}
.roost .pc > *{stroke:#0a0e17;stroke-width:1.5;stroke-linejoin:round;transition:fill 1.2s,stroke 1.2s}
.roost .pc:hover:not(.set) > *,.roost .pc:focus-visible > *{stroke:var(--flame)}
.roost .pc:focus{outline:none}
.roost .legs > *{fill:none;stroke:#8a5a2c;stroke-width:6;stroke-linecap:round}
.roost.whole .pinto > *{fill:url(#pinto);stroke:var(--flame)}
.roost.whole .tail > *{fill:#231611;stroke:var(--flame)}
.roost.whole .red > *{fill:var(--comb);stroke:var(--flame)}
.roost.whole .gold > *{fill:var(--flame)}
.roost.whole .legs > *{fill:none;stroke:var(--flame)}
.roost.whole .ghost{display:none}
.roost.whole{filter:drop-shadow(0 0 22px rgba(246,150,50,.35))}
.roost .eye{fill:#0a0e17!important;stroke:none!important}
.roost .hitbox{fill:transparent!important;stroke:none!important}

/* Livin' */
.neon{font:italic 400 clamp(2rem,6.5vw,4rem)/1.05 var(--text);text-align:center;padding:1.6rem 1rem;width:100%}
.neon small{display:block;font-size:.42em;letter-spacing:.08em;color:#6b6478;margin-bottom:.4em}
.neon b{font-weight:400;display:block;color:#3b3547;text-shadow:none;transition:color .2s}
.neon b.on{animation:flick 1.1s steps(1) both}
.neon b.on.c0{color:#ffd9ec;text-shadow:0 0 6px #ff4f9a,0 0 22px #ff2d85,0 0 60px #d4146b}
.neon b.on.c1{color:#fff1d6;text-shadow:0 0 6px #ffb347,0 0 22px #ff8a1f,0 0 60px #e8662a}
.neon b.on.c2{color:#dffcff;text-shadow:0 0 6px #5fe9ff,0 0 22px #19c3e6,0 0 60px #0b8fb3}
@keyframes flick{0%,18%,26%,40%{opacity:.25}10%,22%,34%,46%,100%{opacity:1}}
.keys{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.keys button{background:#141019;border:1px solid #3b3547;border-radius:6px;padding:.55rem .9rem;color:var(--ash);border-bottom-width:4px}
.keys button[aria-pressed="true"]{border-color:var(--flame);color:var(--rice);transform:translateY(2px);border-bottom-width:2px}

/* Me again */
.mirror{position:relative;width:min(78vw,300px);aspect-ratio:3/4;border-radius:50% 50% 12px 12px/38% 38% 12px 12px;overflow:hidden;
  border:10px solid #3a2a1c;box-shadow:inset 0 0 0 2px #6b4d30,0 20px 50px rgba(0,0,0,.6);
  background:radial-gradient(ellipse at 50% 110%,rgba(246,150,50,.5),transparent 60%),linear-gradient(160deg,#27364a,#0e1622 60%,#1b2a3a);
  display:grid;place-items:center;text-align:center}
.mirror p{margin:0;padding:0 1rem}
.mirror .big{font:400 clamp(1.7rem,6vw,2.3rem)/1 var(--display);color:var(--rice)}
.mirror .small{font-style:italic;margin-top:.6rem;color:var(--ash)}
.mirror canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity 1.2s}
.mirror.clear canvas{opacity:0;pointer-events:none}

/* Uncle Martin */
.porch{width:100%;border-radius:4px;background:radial-gradient(circle at 78% 18%,rgba(255,196,120,.5),transparent 42%),linear-gradient(#4a2c3c,#1e1420)}
.strings{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.strings .str{stroke:#e2c890;stroke-linecap:round}
.strings .str.vib{animation:vib .6s linear}
@keyframes vib{0%,100%{transform:none}10%{transform:translateY(2.5px)}25%{transform:translateY(-2.2px)}40%{transform:translateY(1.6px)}60%{transform:translateY(-1px)}80%{transform:translateY(.5px)}}
.strings .hit{fill:transparent;cursor:pointer}
.strings .hit:focus-visible{outline:none;fill:rgba(246,180,67,.18)}
.strings .dot{fill:none;stroke:rgba(255,255,255,.25)}
.strings .dot.on{fill:var(--flame);stroke:var(--flame)}

/* Break these chains */
.chain{width:min(100%,480px);overflow:visible}
.chain .lk{fill:none;stroke:#77808f;stroke-width:7;transform-box:fill-box;transform-origin:center;transition:transform .9s cubic-bezier(.3,0,.6,1),opacity .9s,stroke .3s}
.chain .lk.broken{stroke:var(--ember);opacity:.3;transform:translateY(70px) rotate(var(--rot))}
.chain .lk.broken:nth-child(even){transform:translate(10px,95px) rotate(var(--rot))}
.chain.pull{animation:shake .4s}

/* Thunder */
.storm{position:relative;width:100%;height:clamp(240px,40vw,340px);overflow:hidden;border-radius:4px;cursor:pointer;
  background:radial-gradient(ellipse at 30% 0,#4a5466,transparent 60%),radial-gradient(ellipse at 80% 10%,#3a4252,transparent 55%),linear-gradient(#1c2230,#0b0e16)}
.storm svg{position:absolute;inset:0;width:100%;height:100%}
.storm .bolt{fill:none;stroke:#f4f7ff;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 8px #bcd0ff);opacity:0}
.storm .bolt.go{animation:bolt .9s ease-out}
@keyframes bolt{0%,30%{opacity:1}100%{opacity:0}}
.storm .count{position:absolute;inset:auto 0 1rem;text-align:center;font:400 clamp(2.2rem,7vw,3.6rem)/1 var(--display);color:rgba(255,255,255,.75);margin:0}
.shake{animation:shake .5s}

/* When death calls your name */
#death{isolation:isolate}
@media (min-width:900px){#death{max-width:none;padding-inline:max(5vw,calc(50vw - 40rem + 5vw))}}
#death .dark{position:absolute;inset:0;z-index:3;pointer-events:none;transition:opacity 2.4s ease;
  background:radial-gradient(circle 250px at var(--lx,22%) var(--ly,18%),transparent 0,transparent 30%,rgba(0,0,0,.975) 100%)}
#death.stood .dark{opacity:0}
.ask{font:400 clamp(1.9rem,5.4vw,3.4rem)/1.05 var(--display);color:var(--rice);text-align:center;margin:0;max-width:14ch;text-wrap:balance}

/* Dawn */
.dawn{min-height:100svh;padding:6rem max(1.25rem,5vw) 10rem;max-width:72rem;margin-inline:auto;display:grid;gap:2.5rem 4rem;align-content:center;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.dawn{grid-template-columns:minmax(0,1fr) minmax(0,24rem)}}
.dawn h2{font-size:clamp(2.6rem,7vw,5rem);color:var(--rice);text-wrap:balance}
.dawn .days{font:400 clamp(1.4rem,3.6vw,2rem)/1.1 var(--display);color:var(--flame);margin:1.4rem 0 .6rem}
.links{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;margin:.4rem 0 1.4rem;padding:0;list-style:none}
.yours{margin-top:2rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,.14)}
.yours h3{font-size:1.5rem;color:var(--rice);margin-bottom:.8rem}
.yours .picks{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1rem}
.yours .picks button{font-size:.92rem;padding:.3rem .8rem}
.yours .picks button[aria-pressed="true"]{background:var(--flame);border-color:var(--flame);color:#150a04}
.yours textarea{width:100%;min-height:5.5rem;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--rice);font:inherit;font-size:1rem;padding:.7rem;border-radius:6px;resize:vertical}
.slot{display:grid;place-items:center;text-align:center;aspect-ratio:1;border:1px dashed currentColor;color:var(--ash-dim);font-size:.9rem;padding:1rem;line-height:1.4;position:relative;overflow:hidden}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.logo img{object-fit:contain;padding:8%}

/* ---------- press kit ---------- */
#press{background:var(--paper);color:var(--ink);min-height:100vh;padding:6rem max(1.25rem,5vw) 5rem}
#press .wrap{max-width:60rem;margin-inline:auto}
#press h1{font-size:clamp(2.4rem,7vw,4.4rem);margin-bottom:.4rem}
#press h2{font-size:1.6rem;margin:3rem 0 1rem;padding-top:1.2rem;border-top:2px solid var(--ink)}
#press h3{font:600 1.1rem/1.3 var(--text);margin:1.4rem 0 .3rem}
#press a{color:var(--mark)}
#press .lede{font-size:1.3rem;line-height:1.45;max-width:40rem}
#press .tools{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.2rem 0 0}
#press .pill{color:var(--ink);border-color:var(--rule)}
#press .pill:hover{border-color:var(--mark)}
#press dl{display:grid;grid-template-columns:minmax(8rem,auto) 1fr;gap:.45rem 1.5rem;margin:0}
#press dt{color:var(--ink-dim)}#press dd{margin:0}
@media (max-width:600px){#press dl{grid-template-columns:1fr;gap:0}#press dt{margin-top:.7rem;font-size:.95rem}}
#press .prose{max-width:40rem}
#press table{width:100%;border-collapse:collapse;font-size:1rem}
#press th,#press td{text-align:left;vertical-align:top;padding:.6rem .8rem .6rem 0;border-bottom:1px solid var(--rule)}
#press th{font-weight:600;color:var(--ink-dim);font-size:.9rem}
#press .scroll{overflow-x:auto}
#press .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:1rem}
#press .slot{color:var(--ink-dim)}
#press .pending{background:color-mix(in srgb,var(--mark) 12%,transparent);border-left:3px solid var(--mark);padding:.8rem 1rem;max-width:40rem}
#press .note{font-size:.95rem;color:var(--ink-dim);max-width:40rem}
#press :focus-visible{outline-color:var(--mark)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media print{

  .bar,#fx,.glow,.flash,#night,.tools,.skip{display:none!important}
  #press{display:block!important;background:#fff;color:#000;padding:0}
  #press a{color:#000}
}

 {id:'campfire-stories',title:'Campfire Stories',time:B('7:30 pm','7:30 p. m.'),sky:['#1b2444','#0a0e17'],stars:1,

 {id:'southern-colored-rooster',title:'Southern Colored Rooster',time:B('9:40 pm','9:40 p. m.'),sky:['#121b33','#090c14'],stars:1,

 {id:'me-again',title:'Me again',time:B('12:20 am','12:20 a. m.'),sky:['#11222f','#0a1016'],stars:.9,

/* =========================================================
   3. SOUND. Everything here is synthesised in the browser.
   Nothing is taken from the record.
   ========================================================= */
let ac=null;
function audio(){if(!state.sound)return null;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function noiseBuf(a,sec,brown){const b=a.createBuffer(1,a.sampleRate*sec,a.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return b}
function pluck(freq){const a=audio();if(!a)return;const sr=a.sampleRate,N=Math.round(sr/freq),len=Math.floor(sr*2.6),b=a.createBuffer(1,len,sr),d=b.getChannelData(0);
  for(let i=0;i<N;i++)d[i]=Math.random()*2-1;
  for(let i=N;i<len;i++)d[i]=(d[i-N]+d[i-N+1])*.4985;
  const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=.5;s.connect(g).connect(a.destination);s.start()}
function thunder(close){const a=audio();if(!a)return;const t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf(a,5,true);f.type='lowpass';f.frequency.value=110+close*700;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35+close*.6,t+.08+(1-close)*.5);
  g.gain.linearRampToValueAtTime(.2+close*.2,t+1);g.gain.linearRampToValueAtTime(.3+close*.2,t+1.6);g.gain.exponentialRampToValueAtTime(.001,t+4.8);
  s.connect(f).connect(g).connect(a.destination);s.start();
  if(close>.7){const c=a.createBufferSource(),cg=a.createGain(),cf=a.createBiquadFilter();c.buffer=noiseBuf(a,.4,false);cf.type='highpass';cf.frequency.value=900;
    cg.gain.setValueAtTime(.5,t);cg.gain.exponentialRampToValueAtTime(.001,t+.35);c.connect(cf).connect(cg).connect(a.destination);c.start()}}
function matchStrike(){const a=audio();if(!a)return;const t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf(a,.6,false);f.type='bandpass';f.frequency.value=3200;f.Q.value=.7;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.55);s.connect(f).connect(g).connect(a.destination);s.start()}

   4. THE SKY AND THE FIRE (one canvas, one loop)
   ========================================================= */
const cv=$('#fx'),c=cv.getContext('2d');let W=0,H=0,stars=[],parts=[],embers=[],raf=0,lastLit=-1;
const fire={level:0,target:0,flare:0,wind:0,stars:1,starT:1};
const sprite=rgb=>{const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,`rgba(${rgb},1)`);r.addColorStop(.45,`rgba(${rgb},.4)`);r.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=r;g.fillRect(0,0,64,64);return s};
const SPR=[sprite('255,216,130'),sprite('240,120,40'),sprite('150,44,22')];
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:Math.min(260,Math.round(W*H/8000))},()=>({x:Math.random()*W,y:Math.random()*H*.82,r:Math.random()<.12?1.7:1,p:Math.random()*6.28}));
  if(reduced)still()}
function setLit(L){const v=Math.round(Math.min(1.2,L)*50)/50;if(v!==lastLit){lastLit=v;root.style.setProperty('--lit',Math.min(1,v));
  root.style.setProperty('--lit1',state.lit?Math.min(1,v/.8):0)}}
function drawStars(t){c.fillStyle='#fff';for(const s of stars){c.globalAlpha=Math.max(0,fire.stars*(.4+.3*Math.sin(t/900+s.p)));c.fillRect(s.x,s.y,s.r,s.r)}c.globalAlpha=1}
function drawLogs(bx,by,s){c.fillStyle='#17100c';for(const a of[-.3,.3]){c.save();c.translate(bx,by);c.rotate(a);c.beginPath();
  if(c.roundRect)c.roundRect(-60*s,-7*s,120*s,14*s,6*s);else c.rect(-60*s,-7*s,120*s,14*s);c.fill();c.restore()}}
function frame(t){raf=requestAnimationFrame(frame);
  fire.level+=(fire.target-fire.level)*.035;fire.flare*=.975;fire.wind*=.96;fire.stars+=(fire.starT-fire.stars)*.03;
  const L=Math.min(1.5,fire.level+fire.flare*.7),s=Math.max(.6,Math.min(1.15,W/900)),bx=W/2,by=H-16*s;
  setLit(L);c.clearRect(0,0,W,H);drawStars(t);drawLogs(bx,by,s);
  if(L>.03){const n=L*5;for(let i=0;i<n;i++)if(Math.random()<n-i)parts.push({x:bx+(Math.random()-.5)*60*s*L,y:by-6,vx:(Math.random()-.5)*.6,vy:-(1+Math.random()*1.9)*s*(.55+L*.7),life:0,max:32+Math.random()*30,r:(24+Math.random()*26)*s*(.5+L*.55)});
    if(Math.random()<L*.4)embers.push({x:bx+(Math.random()-.5)*50*s,y:by-24,vx:(Math.random()-.5)*1.2,vy:-(1.4+Math.random()*2.2),life:0,max:90+Math.random()*130})}
  c.globalCompositeOperation='lighter';
  for(const p of parts){p.life++;p.x+=p.vx+fire.wind*1.6;p.y+=p.vy;p.vx+=(bx-p.x)*.004;const k=p.life/p.max;if(k>=1)continue;
    const r=p.r*(1-k*.7);c.globalAlpha=(1-k)*.5;c.drawImage(SPR[k<.3?0:k<.65?1:2],p.x-r,p.y-r,r*2,r*2)}
  c.fillStyle='#ffc56b';
  for(const e of embers){e.life++;e.x+=e.vx+Math.sin(e.life/9)*.5+fire.wind*3;e.y+=e.vy;c.globalAlpha=Math.max(0,1-e.life/e.max);c.fillRect(e.x,e.y,2,2)}
  c.globalCompositeOperation='source-over';c.globalAlpha=1;
  parts=parts.filter(p=>p.life<p.max);embers=embers.filter(e=>e.life<e.max&&e.y>-10)}
function still(){fire.level=fire.target;fire.stars=fire.starT;setLit(fire.level);c.clearRect(0,0,W,H);drawStars(0);drawLogs(W/2,H-16,1)}
function flare(v=1){fire.flare=Math.max(fire.flare,v);if(reduced)still()}
addEventListener('resize',size);
document.addEventListener('visibilitychange',()=>{if(reduced)return;cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(frame)});

    H2('Track by track','Canción por canción'),

      h('tbody',{},SONGS.map((s,i)=>h('tr',{},h('td',{},i+1),h('td',{lang:'en'},s.title+(s.feat?' ('+s.feat+')':'')),h('td',{t:s.line}),
        h('td',{},h('span',{t:s.year?B('Single, '+s.year+'. ','Sencillo, '+s.year+'. '):i?B('Album track. ','Tema del álbum. '):B('Spoken introduction. ','Introducción hablada. ')}),...(s.credits||[]).flatMap((cr,j)=>[j?'; ':'',h('span',{t:cr})]))))))),
    h('p',{class:'note',style:'margin-top:1rem',t:B('The one-line readings are editorial interpretation written for this experience, based on the published lyrics. They are not statements by the band. Lyrics: scrband.com.','Las lecturas de una línea son interpretación editorial escrita para esta experiencia a partir de las letras publicadas. No son declaraciones de la banda. Letras: scrband.com.')}),

    H2('Who plays','Quién toca'),
    h('h3',{t:B('Core lineup','Formación principal')}),
    h('dl',{},PEOPLE.core.flatMap(p=>[h('dt',{},ext(p[2],p[0])),h('dd',{t:p[1]})])),
    h('h3',{t:B('Additional musicians','Músicos adicionales')}),
    h('dl',{},PEOPLE.guests.flatMap(p=>[h('dt',{},p[0]),h('dd',{t:p[1]})])),
    h('p',{class:'note',style:'margin-top:1rem',t:B('All songs written by Charlie Parra, produced by Andrés Corrales and recorded at 3/4 Estudios.','Todas las canciones fueron escritas por Charlie Parra, producidas por Andrés Corrales y grabadas en 3/4 Estudios.')}),

    H2('Photos and artwork','Fotos y arte'),
    h('div',{class:'photos'},
      h('div',{class:'slot'},h('span',{t:B('Album cover. Loads from scrband.com outside this preview.','Portada del álbum. Carga desde scrband.com fuera de esta vista previa.')}),img(ALBUM.cover,B('Campfire Stories album cover','Portada de Campfire Stories'))),
      h('div',{class:'slot logo',style:'color:var(--ink);border-style:solid;border-color:var(--rule)'},h('span',{class:'logo',role:'img','aria-label':ALBUM.artist,style:'width:78%'})),
      h('div',{class:'slot'},h('span',{t:B('Placeholder: band photo, landscape, high resolution. Not supplied yet.','Espacio reservado: foto de la banda, horizontal, alta resolución. Aún no entregada.')})),
      h('div',{class:'slot'},h('span',{t:B('Placeholder: live or studio photo. Not supplied yet.','Espacio reservado: foto en vivo o en estudio. Aún no entregada.')}))),

    H2('Listen and follow','Escuchar y seguir'),
    h('ul',{class:'links'},LINKS.listen.concat(LINKS.follow).map(l=>h('li',{},ext(l[1],l[0])))),

    H2('For press and promoters','Para prensa y promotores'),
    h('div',{class:'pending'},h('p',{style:'margin-bottom:.4rem'},h('strong',{t:B('Still needed from the band before this kit goes out:','Falta que la banda entregue esto antes de enviar el kit:')})),
      h('ul',{style:'margin:0;padding-left:1.2rem'},
        pend('Press and booking contact (name, email, phone)','Contacto de prensa y contrataciones (nombre, correo, teléfono)'),
        pend('High-resolution photos with photographer credits','Fotos en alta resolución con crédito de fotógrafo'),
        pend('Who sings lead on each track, and on which songs Matt Dame appears','Quién canta la voz principal en cada tema, y en cuáles participa Matt Dame'),
        pend('Album running time, label or distributor, and advance listening link','Duración del álbum, sello o distribuidora, y enlace de escucha anticipada'),
        pend('Live availability, lineup on stage and technical rider','Disponibilidad para conciertos, formación en vivo y rider técnico'))),
    h('p',{class:'note',style:'margin-top:1.2rem',t:B('Sources: everything in this kit comes from scrband.com and material supplied by the band, checked in November 2026. Nothing here has been invented to fill a gap.','Fuentes: todo lo que aparece en este kit viene de scrband.com y de material entregado por la banda, revisado en noviembre de 2026. Nada se inventó para rellenar vacíos.')}))}

/* =========================================================
   9. WIRING: language, sound, routes, scroll
   ========================================================= */
function setLang(l){state.lang=l;save();root.lang=l;
  nodes.forEach(e=>{if(e._t)e.textContent=pick(e._t);if(e._a)for(const a in e._a)e.setAttribute(a,pick(e._a[a]))});
  $('#lang').textContent=l==='en'?'ES':'EN';$('#lang').setAttribute('aria-label',l==='en'?'Cambiar a español':'Switch to English');
  document.title=pick(B('Campfire Stories: The Experience | Southern Colored Rooster','Campfire Stories: La Experiencia | Southern Colored Rooster'));
  setSound(state.sound);listeners.forEach(f=>f())}
function setSound(on){state.sound=on;save();const b=$('#snd');b.setAttribute('aria-pressed',on);b.textContent=pick(on?B('Sound on','Con sonido'):B('Sound off','Sin sonido'));if(!on&&ac)ac.suspend()}

const night=$('#night');
night.append(hero(),...SONGS.slice(1).map((s,i)=>songSection(s,i+1)),dawn());
$('#press').append(press());
$$('[data-en]').forEach(e=>tx(e,B(e.dataset.en,e.dataset.es)));
$('#tl').append(...SONGS.map((s,i)=>h('li',{},h('a',{href:'#'+s.id},h('span',{class:'n'},i+1),h('span',{lang:'en'},s.title),h('span',{class:'ok','data-id':s.id})))));

const tlBtn=$('#tl-btn'),tl=$('#tl');const closeTl=()=>{tl.hidden=true;tlBtn.setAttribute('aria-expanded','false')};
tlBtn.addEventListener('click',e=>{e.stopPropagation();tl.hidden=!tl.hidden;tlBtn.setAttribute('aria-expanded',!tl.hidden)});
document.addEventListener('click',e=>{if(!tl.contains(e.target))closeTl()});tl.addEventListener('click',closeTl);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!tl.hidden){closeTl();tlBtn.focus()}});
$('#lang').addEventListener('click',()=>setLang(state.lang==='en'?'es':'en'));
$('#snd').addEventListener('click',()=>{setSound(!state.sound);if(state.sound)audio()});

function enter(sec){const [a,b]=sec.dataset.sky.split(',');root.style.setProperty('--sky-a',a);root.style.setProperty('--sky-b',b);
  fire.starT=+sec.dataset.stars;const first=sec.id===SONGS[0].id;if(!first&&!state.lit)light(true);
  fire.target=!state.lit?0:first?1:sec.id==='dawn'?.3:sec.id==='death'&&!state.done.death?.12:.5;
  $$('#tl a').forEach(l=>l.getAttribute('href')==='#'+sec.id?l.setAttribute('aria-current','true'):l.removeAttribute('aria-current'));
  if(reduced)still()}
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&enter(e.target)),{rootMargin:'-45% 0px -45% 0px'});
$$('#night > section').forEach(s=>io.observe(s));

function route(){const id=decodeURIComponent(location.hash.slice(1)),pressView=id==='press';
  document.body.dataset.view=pressView?'press':'night';
  if(pressView){scrollTo(0,0);return}
  const t=id&&document.getElementById(id);if(t&&night.contains(t))t.scrollIntoView();}
addEventListener('hashchange',route);

size();setLang(state.lang);progress();
if(state.lit){fire.target=1;fire.level=reduced?1:.2}
route();
if(reduced)still();else raf=requestAnimationFrame(frame);
})();
</script>
